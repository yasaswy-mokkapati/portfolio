    <link rel="icon" type="image/png" sizes="32x32" href="logo.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            background-color: #030712;
            color: #e2e8f0;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-space { font-family: 'Space Grotesk', sans-serif; }

        .glow-cyan { filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.7)); }
        .glow-purple { filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.6)); }
        .glow-moon { filter: drop-shadow(0 0 30px rgba(254, 240, 138, 0.9)); }

        .interactive-obj {
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), filter 0.4s ease, opacity 0.6s ease;
            transform-origin: center;
        }

        .interactive-obj:hover {
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.9)) brightness(1.3);
        }

        .room-element {
            transition: opacity 0.8s ease, filter 0.8s ease;
        }

        .room-faded {
            opacity: 0.05 !important;
            filter: blur(4px);
            pointer-events: none;
        }

        #room-svg-container {
            width: 100vw;
            height: 100vh;
            transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1);
            transform-origin: 50% 50%;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .star-1 { animation: twinkle 3s infinite ease-in-out; }
        .star-2 { animation: twinkle 4.5s infinite ease-in-out 1s; }
        .star-3 { animation: twinkle 2.5s infinite ease-in-out 0.5s; }

        @keyframes ledPulse {
            0%, 100% { fill: #06b6d4; opacity: 0.5; }
            50% { fill: #22d3ee; opacity: 1; filter: drop-shadow(0 0 8px #22d3ee); }
        }
        .led-pulse { animation: ledPulse 1.8s infinite ease-in-out; }

        @keyframes idleBreathe {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        .student-idle { animation: idleBreathe 3.5s infinite ease-in-out; }

        @keyframes orbit {
            from { transform: rotate(0deg) translateX(85px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(85px) rotate(-360deg); }
        }
        .satellite-orbit { animation: orbit 22s linear infinite; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
        }

        .side-drawer {
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #070a13; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; border: 1px solid #38bdf8; }
        ::-webkit-scrollbar-thumb:hover { background: #0284c7; }
    </style>
</head>

        let activeSection = 'room';

        // Dynamic Target-Centered Zoom Computation with Customized Framing
        function zoomToSection(sectionKey) {
            const svgContainer = document.getElementById('room-svg-container');
            const elementId = elementIdMap[sectionKey];
            const targetGroup = document.getElementById(elementId);
            const drawer = document.getElementById('side-drawer');
            const drawerTitle = document.getElementById('drawer-title');
            const drawerBreadcrumb = document.getElementById('drawer-breadcrumb');
            const drawerBody = document.getElementById('drawer-body-content');
            const instructions = document.getElementById('room-instructions');

            if (!targetGroup || !pageContents[sectionKey]) return;

            activeSection = sectionKey;

            // 1. Calculate Target Bounding Box in SVG Native Coordinate Space (1200 x 750)
            const bbox = targetGroup.getBBox();
            const targetCenterX = bbox.x + bbox.width / 2;
            const targetCenterY = bbox.y + bbox.height / 2;

            // 2. Fetch specific framing parameters for the selected element
            const config = zoomConfigs[sectionKey] || { desktopScale: 1.35, mobileScale: 1.20, screenX: 360, screenY: 375 };
            const isDesktop = window.innerWidth >= 1024;
            const zoomScale = isDesktop ? config.desktopScale : config.mobileScale;

            // Compute precise focal positions to keep element fully within screen bounds
            const desiredScreenPositionX = isDesktop ? config.screenX : 600; 
            const desiredScreenPositionY = config.screenY; 

            const translateX = desiredScreenPositionX - targetCenterX;
            const translateY = desiredScreenPositionY - targetCenterY;

            // Apply SVG camera transform around target center point
            svgContainer.style.transformOrigin = `${targetCenterX}px ${targetCenterY}px`;
            svgContainer.style.transform = `scale(${zoomScale}) translate(${translateX}px, ${translateY}px)`;

            // 3. Fade out background room elements while keeping focal clicked item highlighted
            document.querySelectorAll('.room-element').forEach(el => {
                if (el.id === elementId || (sectionKey === 'space' && el.id === 'window-group')) {
                    el.classList.remove('room-faded');
                    if (el.id === elementId) {
                        el.style.filter = "drop-shadow(0 0 25px rgba(254, 240, 138, 0.95)) brightness(1.3)";
                    }
                } else {
                    el.classList.add('room-faded');
                }
            });

            // Hide instruction banner
            instructions.style.opacity = '0';

            // 4. Inject Section Content & Reveal Side Drawer (Right side)
            const content = pageContents[sectionKey];
            drawerBreadcrumb.innerText = content.breadcrumb;
            drawerTitle.innerText = content.title;
            drawerBody.innerHTML = `
                <p class="text-xs text-cyan-300 font-space italic">${content.tagline}</p>
                ${content.html}
            `;

            lucide.createIcons();

            setTimeout(() => {
                drawer.classList.remove('translate-x-full', 'opacity-0', 'pointer-events-none');
                drawer.classList.add('translate-x-0', 'opacity-100');
            }, 300);
        }

        // Reset Camera & Return to Room View
        function resetToRoomView() {
            const svgContainer = document.getElementById('room-svg-container');
            const drawer = document.getElementById('side-drawer');
            const instructions = document.getElementById('room-instructions');

            // Slide out side drawer
            drawer.classList.remove('translate-x-0', 'opacity-100');
            drawer.classList.add('translate-x-full', 'opacity-0', 'pointer-events-none');

            // Reset camera zoom & position back to room view
            svgContainer.style.transformOrigin = `50% 50%`;
            svgContainer.style.transform = `scale(1) translate(0px, 0px)`;

            // Restore opacity and remove filter on room elements
            document.querySelectorAll('.room-element').forEach(el => {
                el.classList.remove('room-faded');
                el.style.filter = "";
            });

            // Show instruction banner
            instructions.style.opacity = '1';

            activeSection = 'room';
        }

            }, 3000);
        }
